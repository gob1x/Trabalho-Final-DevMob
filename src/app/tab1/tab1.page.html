<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Minhas Tarefas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <!-- Lista de Tarefas -->
  <ion-list class="ion-padding-bottom">
    <ion-item-sliding *ngFor="let t of tarefas">
      
      <ion-item button (click)="editar(t.id)" lines="full" class="task-item">
        <ion-label>
          <h2>{{ t.titulo }}</h2>
          <p>{{ t.descricao }}</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end" color="medium"></ion-icon>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmarExclusao(t.id)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>

    <!-- Mensagem se a lista estiver vazia -->
    <div *ngIf="tarefas.length === 0" class="empty-state">
      <ion-icon name="clipboard-outline"></ion-icon>
      <p>Sua lista está vazia.<br>Que tal adicionar algo?</p>
    </div>
  </ion-list>

  <!-- Espaço extra -->
  <div style="height: 80px;"></div>

  <!-- Botão "Nova Tarefa" -->
  <div slot="fixed" class="fab-container">
    <!-- Removemos classes extra do ion-button e usamos um container interno -->
    <ion-button 
      shape="round" 
      color="tertiary" 
      class="custom-fab"
      (click)="criarNova()">
      <div class="fab-content">
        <ion-icon name="add-circle"></ion-icon>
        <span>Nova Tarefa</span>
      </div>
    </ion-button>
  </div>

</ion-content>
